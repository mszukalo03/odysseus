<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Argos — Options</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 20px;
    background: #16161a;
    color: #e8e8e8;
  }
  h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
  h1 svg { color: #7c9cff; }
  .card {
    background: #1f1f25;
    border: 1px solid #2c2c35;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: #8a8a96; margin: 12px 0 4px; }
  input, select {
    width: 100%;
    box-sizing: border-box;
    background: #16161a;
    border: 1px solid #2c2c35;
    border-radius: 8px;
    color: #e8e8e8;
    padding: 8px 10px;
    font: inherit;
  }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button {
    background: #7c9cff;
    color: #0e0e12;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: #2c2c35; color: #e8e8e8; }
  #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
  #status.ok { color: #7fd08a; }
  #status.err { color: #e0716b; }
  p.hint { color: #8a8a96; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<h1>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
  Argos options
</h1>

<div class="card">
  <label for="server-url">Odysseus server URL</label>
  <input id="server-url" type="url" placeholder="http://127.0.0.1:24950" autocomplete="off">

  <label for="token">Pairing token</label>
  <input id="token" type="password" placeholder="ody_..." autocomplete="off">
  <p class="hint">Mint one from your Odysseus instance: open the Argos page (Settings &rarr; Extensions, or your server's <code>/argos</code> route) and click "Mint pairing token". Admin only.</p>

  <div class="row">
    <button id="grant-btn" class="secondary" type="button">Grant site access</button>
    <button id="test-btn" class="secondary" type="button">Test connection</button>
    <button id="save-btn" type="button">Save</button>
  </div>
  <div id="status"></div>
</div>

<div class="card" id="model-card" hidden>
  <label for="model-select">Default model</label>
  <select id="model-select"></select>
</div>

<script src="options.js" type="module"></script>
</body>
</html>
